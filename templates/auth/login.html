{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p>Demo accounts are in the README. Data is fictional.</p>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    <label>{{ form.email.label }} {{ form.email() }}</label>
    <label>{{ form.password.label }} {{ form.password() }}</label>
    {{ form.submit() }}
  </form>
</section>
{% endblock %}
